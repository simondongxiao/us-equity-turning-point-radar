name: radar-index-intraday-refresh

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-pages-index-intraday
  cancel-in-progress: false

jobs:
  refresh-index-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Download the latest completed daily derived dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow publish.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          mkdir -p /tmp/daily-derived
          gh run download "$run_id" --name "radar-derived-$run_id" --dir /tmp/daily-derived
          dashboard=$(find /tmp/daily-derived -name 'dashboard-*.json' -type f | head -n 1)
          test -n "$dashboard"
          echo "DAILY_DASHBOARD=$dashboard" >> "$GITHUB_ENV"
      - run: python scripts/index_intraday.py --refresh --input "$DAILY_DASHBOARD" --output site/data.json --html site/index.html
      - run: python scripts/validate_delivery.py --dashboard site/data.json --production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
