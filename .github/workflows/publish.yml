name: radar-daily-build

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-pages-batch
  cancel-in-progress: false

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test*.py'
      - run: node tests/sort.test.cjs
      - run: python scripts/restore_frozen.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/radar_engine.py --output site/data.json
      - run: python scripts/audit_upgrade.py --input site/data.json --output site/data.json
      - run: python scripts/render_audit.py
      - run: python scripts/render_preview.py --input site/data.json --output site/index.html
      - run: python scripts/validate_delivery.py --dashboard site/data.json --production
      - name: Retain frozen derived forecasts and evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-derived-${{ github.run_id }}
          path: |
            outputs/dashboard-*.json
            outputs/backtest-*.json
            state/audit/**
            state/frozen/**
          retention-days: 90
          if-no-files-found: error
      - name: Publish Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
